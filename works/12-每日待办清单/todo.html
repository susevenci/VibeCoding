<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日待办清单</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 214, 165, 0.35), transparent 55%),
        radial-gradient(circle at 85% 80%, rgba(255, 236, 179, 0.4), transparent 50%),
        #faf3e0;
      background-attachment: fixed;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .header {
      padding: 20px 20px 16px;
      text-align: center;
    }
    .header-title {
      font-family: "STXingkai", "华文行楷", "Xingkai SC", "楷体", KaiTi, cursive;
      font-size: 30px;
      color: #6b4b2f;
      font-weight: 400;
      letter-spacing: 2px;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .today-date {
      display: block;
      font-size: 13px;
      color: #b09468;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .counter {
      display: inline-block;
      font-size: 14px;
      color: #8a6f4e;
      font-weight: 500;
      background: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(160, 120, 70, 0.1);
    }
    .counter span {
      color: #e07b39;
      font-weight: 700;
      font-size: 16px;
    }
    .input-area {
      padding: 0 4px 20px;
      position: relative;
      z-index: 5;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
      min-width: 0;
      padding: 14px 18px;
      background: #fff;
      border: 1px solid #f0e2c8;
      border-radius: 14px;
      font-size: 16px;
      color: #4a3520;
      outline: none;
      box-shadow: 0 2px 8px rgba(160, 120, 70, 0.07);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-row input::placeholder {
      color: #c3b294;
    }
    .input-row input:focus {
      border-color: #e8a45c;
      box-shadow: 0 2px 12px rgba(224, 123, 57, 0.18);
    }
    .input-row button {
      padding: 14px 26px;
      background: linear-gradient(135deg, #f09a4d, #e07b39);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(224, 123, 57, 0.32);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.2s;
      flex-shrink: 0;
    }
    .input-row button:hover {
      filter: brightness(1.05);
      box-shadow: 0 6px 16px rgba(224, 123, 57, 0.4);
      transform: translateY(-1px);
    }
    .input-row button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 6px rgba(224, 123, 57, 0.35);
    }
    .error-msg {
      color: #e07b39;
      font-size: 13px;
      padding-left: 6px;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.2s, opacity 0.2s, margin-top 0.2s;
    }
    .error-msg.show {
      max-height: 30px;
      opacity: 1;
      margin-top: 8px;
    }
    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 60px;
    }
    .todo-item {
      display: flex;
      align-items: center;
      padding: 16px 18px;
      background: #fff;
      border-radius: 16px;
      gap: 14px;
      box-shadow: 0 2px 10px rgba(160, 120, 70, 0.1), 0 1px 2px rgba(160, 120, 70, 0.06);
      transition: transform 0.22s ease, box-shadow 0.22s ease, opacity 0.22s ease;
      animation: slideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .todo-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(160, 120, 70, 0.16), 0 2px 4px rgba(160, 120, 70, 0.08);
    }
    .todo-item.completed {
      opacity: 0.72;
    }
    .todo-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid #e6d5b8;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .todo-checkbox:hover {
      border-color: #f0a45c;
      transform: scale(1.06);
    }
    .todo-checkbox.checked {
      background: linear-gradient(135deg, #f0a45c, #e07b39);
      border-color: #e07b39;
    }
    .todo-checkbox.checked::after {
      content: "✓";
      color: white;
      font-size: 15px;
      font-weight: bold;
    }
    .todo-text {
      position: relative;
      flex: 1;
      font-size: 16px;
      color: #4a3520;
      word-break: break-word;
      line-height: 1.45;
      transition: color 0.25s;
    }
    .todo-text::after {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      height: 2px;
      width: 100%;
      background: #b9a684;
      border-radius: 2px;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .todo-item.completed .todo-text {
      color: #b0a189;
    }
    .todo-item.completed .todo-text::after {
      transform: scaleX(1);
    }
    .todo-delete {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c9bda9;
      font-size: 20px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .todo-delete:hover {
      background: #fdf0e4;
      color: #e07b39;
      transform: rotate(90deg);
    }
    .empty-state {
      text-align: center;
      padding: 44px 20px;
      color: #a89272;
      font-size: 15px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(160, 120, 70, 0.08);
      animation: slideIn 0.28s ease;
    }
    .empty-icon {
      display: block;
      font-size: 40px;
      line-height: 1;
      margin-bottom: 14px;
      animation: floatSun 3s ease-in-out infinite;
    }
    @keyframes floatSun {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .empty-text {
      font-family: "STXingkai", "华文行楷", "Xingkai SC", "楷体", KaiTi, cursive;
      font-size: 21px;
      color: #8a6f4e;
      letter-spacing: 2px;
    }
    .clear-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      background: #fff;
      color: #a89272;
      border: 1px dashed #e6d5b8;
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .clear-btn:hover {
      background: #fdf0e4;
      border-color: #e8a45c;
      color: #e07b39;
    }
    .clear-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .clear-btn:disabled:hover {
      background: #fff;
      border-color: #e6d5b8;
      color: #a89272;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #6b4b2f;
      color: #fff8ec;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 6px 18px rgba(107, 75, 47, 0.3);
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px 12px;
      }
      .header {
        padding: 12px 8px 14px;
      }
      .header-title {
        font-size: 25px;
      }
      .input-area {
        padding: 0 0 16px;
      }
      .input-row {
        gap: 8px;
      }
      .input-row input {
        padding: 13px 14px;
      }
      .input-row button {
        padding: 13px 18px;
        letter-spacing: 0;
      }
      .todo-item {
        padding: 14px 14px;
        gap: 12px;
      }
      .todo-list {
        gap: 10px;
      }
      .empty-state {
        padding: 36px 16px;
      }
      .toast {
        bottom: 20px;
        font-size: 13px;
        padding: 11px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="header-title">每日待办清单</h1>
      <span class="today-date" id="todayDate"></span>
      <div class="counter">今天还有 <span id="counter">0</span> 件事</div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <input type="text" id="todoInput" placeholder="输入今天要做的事...">
        <button id="addBtn">添加</button>
      </div>
      <div class="error-msg" id="errorMsg">请先输入内容</div>
    </div>
    <ul class="todo-list" id="todoList"></ul>
      <button class="clear-btn" id="clearBtn" disabled>清除已完成</button>
    </div>
    <div class="toast" id="toast"></div>

  <script>
    const todoInput = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const errorMsg = document.getElementById('errorMsg');
    const todoList = document.getElementById('todoList');
    const counter = document.getElementById('counter');
    const clearBtn = document.getElementById('clearBtn');
    const toast = document.getElementById('toast');
    const todayDate = document.getElementById('todayDate');

    let todos = [];

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function loadTodos() {
      const data = localStorage.getItem('todos');
      if (data) {
        try {
          todos = JSON.parse(data);
        } catch (e) {
          todos = [];
        }
      }
    }

    function updateDate() {
      const now = new Date();
      const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      todayDate.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;
    }

    function updateCounter() {
      const activeCount = todos.filter(t => !t.completed).length;
      counter.textContent = activeCount;
    }

    function renderTodos() {
      todoList.innerHTML = '';
      if (todos.length === 0) {
        todoList.innerHTML = '<li class="empty-state"><span class="empty-icon">☀️</span><span class="empty-text">今天也要加油呀</span></li>';
      } else {
        todos.forEach((todo, index) => {
          const li = document.createElement('li');
          li.className = 'todo-item' + (todo.completed ? ' completed' : '');
          li.innerHTML = `
            <div class="todo-checkbox${todo.completed ? ' checked' : ''}" data-index="${index}"></div>
            <span class="todo-text">${escapeHtml(todo.text)}</span>
            <div class="todo-delete" data-index="${index}">×</div>
          `;
          todoList.appendChild(li);
        });
      }
      const completedCount = todos.filter(t => t.completed).length;
      clearBtn.disabled = completedCount === 0;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showError() {
      errorMsg.classList.add('show');
      setTimeout(() => {
        errorMsg.classList.remove('show');
      }, 2000);
    }

    function addTodo() {
      const text = todoInput.value.trim();
      if (!text) {
        showError();
        return;
      }
      todos.unshift({ text, completed: false });
      todoInput.value = '';
      saveTodos();
      renderTodos();
      updateCounter();
    }

    function toggleTodo(index) {
      todos[index].completed = !todos[index].completed;
      saveTodos();
      renderTodos();
      updateCounter();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      saveTodos();
      renderTodos();
      updateCounter();
    }

    function clearCompleted() {
      const completedCount = todos.filter(t => t.completed).length;
      if (completedCount === 0) return;
      todos = todos.filter(t => !t.completed);
      saveTodos();
      renderTodos();
      updateCounter();
      showToast(`已清理 ${completedCount} 项`);
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    addBtn.addEventListener('click', addTodo);

    todoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    todoList.addEventListener('click', (e) => {
      const checkbox = e.target.closest('.todo-checkbox');
      const deleteBtn = e.target.closest('.todo-delete');
      if (checkbox) {
        const index = parseInt(checkbox.dataset.index);
        toggleTodo(index);
      } else if (deleteBtn) {
        const index = parseInt(deleteBtn.dataset.index);
        deleteTodo(index);
      }
    });

    clearBtn.addEventListener('click', clearCompleted);

    // 初始渲染
    loadTodos();
    renderTodos();
    updateCounter();
    updateDate();
    setInterval(updateDate, 60000);
  </script>
</body>
</html>
